<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>봄볼래 · 안 본 작품만 골라 주는 추천</title>
<meta name="description" content="본 작품은 빼고, 내 취향에 맞는 드라마·영화·애니만 이유와 함께 추천해 주는 웹 앱">
<meta name="theme-color" content="#FFF6F8">
<!-- 링크 미리보기 카드 (카카오톡, 노션, 슬랙, 이력서 사이트 등) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="봄볼래">
<meta property="og:title" content="봄볼래 · 당신이 원하는 오늘의 즐거움">
<meta property="og:description" content="본 건 빼고, 안 본 드라마·영화·애니만 이유와 함께 추천해 주는 웹 앱">
<meta property="og:url" content="https://bombollae.vercel.app">
<meta property="og:image" content="https://bombollae.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="봄볼래 · 당신이 원하는 오늘의 즐거움">
<meta name="twitter:description" content="본 건 빼고, 안 본 드라마·영화·애니만 이유와 함께 추천해 주는 웹 앱">
<meta name="twitter:image" content="https://bombollae.vercel.app/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 휴대폰 '홈 화면에 추가'로 앱처럼 설치 (주소창 없이 전체 화면) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="봄볼래">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 꽃 그림에서 여러 번 쓰는 모양(꽃잎, 그라데이션)을 한 번만 정의해 둔다 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="sk" cx="0" cy="0" r="24" gradientUnits="userSpaceOnUse"><stop offset="0.12" stop-color="#FFFFFF"/><stop offset="0.62" stop-color="#FBD3DD"/><stop offset="1" stop-color="#F19CB4"/></radialGradient>
    <path id="skp" d="M0 0C-7-4-12-14-8-22C-6-26-3-26 0-22C3-26 6-26 8-22C12-14 7-4 0 0Z" fill="url(#sk)" stroke="#EFA3B8" stroke-width="0.6"/>
    <g id="skf"><use href="#skp"/><use href="#skp" transform="rotate(72)"/><use href="#skp" transform="rotate(144)"/><use href="#skp" transform="rotate(216)"/><use href="#skp" transform="rotate(288)"/><path d="M0 0L8 0M0 0L5.7 5.7M0 0L0 8M0 0L-5.7 5.7M0 0L-8 0M0 0L-5.7-5.7M0 0L0-8M0 0L5.7-5.7" stroke="#D96A89" stroke-width="0.7" stroke-linecap="round"/><circle r="2.4" fill="#E8899F"/></g>
    <!-- 꽃 테마 그림용 색 (꽃잎·잎은 아래쪽이 진하고 끝으로 갈수록 밝아진다) -->
    <linearGradient id="sff" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F4B12E"/><stop offset="1" stop-color="#FFE48A"/></linearGradient>
    <linearGradient id="sfb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E39A1C"/><stop offset="1" stop-color="#F8CC58"/></linearGradient>
    <radialGradient id="sfc" cx="0.42" cy="0.38" r="0.65"><stop offset="0" stop-color="#A2703C"/><stop offset="0.65" stop-color="#6E4724"/><stop offset="1" stop-color="#4F3118"/></radialGradient>
    <linearGradient id="lfg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#78A964"/><stop offset="1" stop-color="#B9D9A2"/></linearGradient>
    <linearGradient id="lvb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8A68C7"/><stop offset="1" stop-color="#D6C5F3"/></linearGradient>
    <linearGradient id="hy1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#9CBCF0"/></linearGradient>
    <linearGradient id="hy2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F7F4FF"/><stop offset="1" stop-color="#B8ADEF"/></linearGradient>
    <linearGradient id="hy3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F2F9FF"/><stop offset="1" stop-color="#A3CDEF"/></linearGradient>
    <linearGradient id="tpf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDD5C8"/><stop offset="1" stop-color="#EF8069"/></linearGradient>
    <linearGradient id="tps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7AE99"/><stop offset="1" stop-color="#DC6650"/></linearGradient>
    <!-- 로고·꽃잎 효과에서 함께 쓰는 꽃잎 모양과 재생 표시 색 -->
    <radialGradient id="lg" cx="0" cy="0" r="28" gradientUnits="userSpaceOnUse"><stop offset="0.1" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#FBD3DD"/><stop offset="1" stop-color="#EE93AD"/></radialGradient>
    <path id="lp" d="M0 0C-8-4.6-13.8-16-9.2-25.3C-6.9-29.9-3.5-29.9 0-25.3C3.5-29.9 6.9-29.9 9.2-25.3C13.8-16 8-4.6 0 0Z"/>
    <linearGradient id="pg" x1="-2" y1="-3.4" x2="3.6" y2="3.4" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EE8FAA"/><stop offset="1" stop-color="#B0456A"/></linearGradient>
    <linearGradient id="tlg" x1="0" y1="-22" x2="0" y2="8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FBC9B9"/><stop offset="1" stop-color="#EE8A72"/></linearGradient>
  </defs>
</svg>

<!-- 시작 화면: 꽃잎이 피어나고 로고가 뜬 뒤 사라진다. 누르면 바로 넘어간다. -->
<div class="splash" id="splash" aria-hidden="true">
  <svg class="splash-mark" viewBox="-32 -32 64 64">
    
    <g class="bloom" fill="url(#lg)" stroke="#E58BA4" stroke-width="0.7">
      <g><use class="petal p1" href="#lp"/></g>
      <g transform="rotate(72)"><use class="petal p2" href="#lp"/></g>
      <g transform="rotate(144)"><use class="petal p3" href="#lp"/></g>
      <g transform="rotate(216)"><use class="petal p4" href="#lp"/></g>
      <g transform="rotate(288)"><use class="petal p5" href="#lp"/></g>
    </g>
    <!-- 가운데: 모서리가 둥근 핑크 재생 표시 -->
    <g class="core">
      <path d="M-2.2-3.9L4.3 0L-2.2 3.9Z" fill="url(#pg)" stroke="url(#pg)" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </svg>
  <div class="splash-name"><span>봄</span>볼래</div>
  <div class="splash-tag">당신이 원하는 오늘의 즐거움</div>
</div>

<!-- 넓은 화면(PC)에서만 보이는 왼쪽 소개: 처음 보는 사람이 무슨 앱인지 바로 알 수 있게 -->
<aside class="desk-intro" aria-label="봄볼래 소개">
  <svg class="desk-logo" viewBox="-32 -32 64 64" aria-hidden="true">
    <g fill="url(#lg)" stroke="#E58BA4" stroke-width="0.7"><use href="#lp"/><use href="#lp" transform="rotate(72)"/><use href="#lp" transform="rotate(144)"/><use href="#lp" transform="rotate(216)"/><use href="#lp" transform="rotate(288)"/></g>
    <path d="M-2.2-3.9L4.3 0L-2.2 3.9Z" fill="url(#pg)" stroke="url(#pg)" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <h2 class="desk-name"><span>봄</span>볼래</h2>
  <p class="desk-tag">당신이 원하는 오늘의 즐거움</p>
  <ul class="desk-points">
    <li>본 작품은 빼고, 안 본 것만 추천해요</li>
    <li>왜 재밌을지 이유를 같이 알려 줘요</li>
    <li>드라마 · 영화 · 애니, 볼 수 있는 곳까지</li>
    <li>고르기 힘들면 월드컵으로 오늘의 한 편</li>
  </ul>
  <div class="desk-qr">
    <img src="qr.svg" alt="휴대폰으로 봄볼래 열기 QR 코드" width="96" height="96">
    <span>휴대폰 카메라로 찍으면<br>바로 열려요</span>
  </div>
</aside>

<div class="deco deco-tl" id="decoTL" aria-hidden="true"></div>
<div class="deco deco-br" id="decoBR" aria-hidden="true"></div>
<!-- 오른쪽 위 꽃 테마 버튼: 누르면 꽃 5개가 나오고 바로 바꿀 수 있다 -->
<button type="button" class="theme-fab" id="themeFab" data-act="themeMenu" aria-label="꽃 테마 바꾸기" aria-expanded="false" aria-controls="themePop"></button>
<div class="theme-pop" id="themePop" hidden></div>
<main class="app" id="view"></main>
<nav class="nav" id="nav" aria-label="메뉴" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
